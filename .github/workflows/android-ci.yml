name: Android CI

on:
  # iOS 만 건드린 PR 에서 Gradle 파이프라인 전체가 도는 걸 막는다.
  # push 쪽에는 필터를 걸지 않는다 — paths 필터는 태그 push 에도 적용돼서
  # 릴리스 커밋이 마침 ios/** 만 건드린 경우 릴리스 job 이 통째로 skip 된다.
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'ios/**'
  push:
    branches:
      - master
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      build_release_bundle:
        description: Build the signed release AAB
        required: true
        type: boolean
        default: false
      version_name:
        description: 'versionName for a manual release build, e.g. 1.0.2 (required when build_release_bundle is checked)'
        required: false
        type: string
        default: ''
      distribute_debug:
        description: Upload the debug APK to Firebase App Distribution
        required: true
        type: boolean
        default: false
      tester_groups:
        description: Firebase tester groups
        required: false
        type: string
        default: testers

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run static analysis
        run: ./gradlew --no-daemon detekt

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: |
            **/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run Android lint
        run: ./gradlew --no-daemon :data:lintDebug :presentation:lintDebug :app:lintDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            data/build/reports/
            presentation/build/reports/
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  # 앱 동작과 무관한 파일만 바꾼 PR에서는 에뮬레이터를 띄우지 않는다. build와 동시에 돌아서 시간을 늘리지 않는다.
  # PR이 아닌 실행(master 푸시, 태그, 수동 실행)은 항상 E2E를 돌린다.
  e2e_changes:
    name: Decide whether to run E2E
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          # 이 목록에 없는 파일이 하나라도 바뀌면 E2E를 돌린다. 모르는 경로는 돌리는 쪽이 안전하다.
          RELEVANT=$(printf '%s\n' "$CHANGED" \
            | grep -vE '^(docs|functions|store-assets|ios|\.claude)/' \
            | grep -vE '\.md$' \
            | grep -vE '^(firebase\.json|firestore\.rules|\.firebaserc|\.coderabbit\.yaml|\.mcp\.json)$' \
            || true)

          if [ -n "$RELEVANT" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No app-related changes; skipping E2E."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  e2e_smoke:
    name: Maestro smoke test
    needs: [build, e2e_changes]
    if: ${{ needs.e2e_changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 버전을 고정하지 않으면 Maestro 새 릴리스의 동작 변화로 코드 변경 없이 CI가 깨진다.
      MAESTRO_VERSION: 2.1.0
      API_LEVEL: 34
      # 기본값(2코어, RAM 2.5GB)에서는 google_apis 이미지가 부팅 후 작업만으로 여유가 없어 앱 첫 프레임이 15초를 넘기곤 했다.
      # ubuntu-latest 러너는 4 vCPU / 16GB다. 바꾸면 스냅샷과 맞지 않으니 AVD_CACHE_VERSION도 올린다.
      EMULATOR_CORES: 4
      EMULATOR_RAM_SIZE: 4096M
      # AVD 생성 옵션이나 스냅샷 만드는 방법을 바꾸면 올린다. 캐시 키에 들어가 스냅샷을 새로 만든다.
      AVD_CACHE_VERSION: 2
      APP_ID: com.ahn.calcmoney
      # smoke Flow는 네트워크가 필요 없다. release Flow(Firestore 필요)는 CI에서 돌리지 않는다.
      MAESTRO_TAGS: smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Maestro CLI가 JVM으로 돈다.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu 러너는 KVM을 지원하지만 기본으로는 일반 사용자에게 열려 있지 않다.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: artifacts

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Restore AVD cache
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64-v${{ env.AVD_CACHE_VERSION }}

      # 캐시가 없을 때만 AVD를 만들고 부팅 스냅샷을 남긴다. 다음 실행부터는 스냅샷에서 바로 뜬다.
      # 부팅 직후 바로 찍으면 밀린 작업(GMS 초기화, dexopt)까지 스냅샷에 담겨 매 실행마다 되풀이되므로,
      # 에뮬레이터가 조용해진 뒤에 종료해 스냅샷을 저장한다.
      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          cores: ${{ env.EMULATOR_CORES }}
          ram-size: ${{ env.EMULATOR_RAM_SIZE }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: .github/scripts/emulator-settle.sh 300

      - name: Run Maestro smoke flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          cores: ${{ env.EMULATOR_CORES }}
          ram-size: ${{ env.EMULATOR_RAM_SIZE }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # 스냅샷에서 뜬 직후에도 패키지 매니저가 준비되기 전이거나 밀린 작업이 남아 있을 수 있어 한 번 더 기다린다.
          script: |
            .github/scripts/emulator-settle.sh 120
            .github/scripts/maestro-smoke.sh

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-smoke-results
          path: build/maestro/
          if-no-files-found: ignore
          retention-days: 7

  release_bundle:
    name: Build signed release bundle
    needs: build
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/android-v') || (github.event_name == 'workflow_dispatch' && inputs.build_release_bundle) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Missing RELEASE_KEYSTORE_BASE64 secret"
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      # 태그 릴리스면 태그 이름에서, 수동 실행이면 입력값에서 versionName 을 뽑는다.
      # workflow_dispatch 때 GITHUB_REF_NAME 은 브랜치명(master)이라 그대로 쓰면 안 된다.
      - name: Resolve versionName
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION_NAME="$INPUT_VERSION_NAME"
            if [ -z "$VERSION_NAME" ]; then
              echo "::error::수동 릴리스에는 version_name 입력이 필요합니다"
              exit 1
            fi
          else
            VERSION_NAME="${GITHUB_REF_NAME#android-v}"
          fi
          if ! printf '%s' "$VERSION_NAME" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::versionName 형식이 올바르지 않습니다: $VERSION_NAME"
            exit 1
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Build release bundle
        run: |
          VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))
          ./gradlew --no-daemon :app:bundleRelease \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_EXCHANGE_BANNER_ID: ${{ secrets.ADMOB_EXCHANGE_BANNER_ID }}
          ADMOB_FAVORITE_BANNER_ID: ${{ secrets.ADMOB_FAVORITE_BANNER_ID }}
          ADMOB_SETTINGS_BANNER_ID: ${{ secrets.ADMOB_SETTINGS_BANNER_ID }}
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

  google_play_internal:
    name: Publish to Google Play internal testing
    needs: release_bundle
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/android-v') }}

    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: artifacts

      - name: Upload AAB to Google Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ahn.calcmoney
          releaseFiles: artifacts/*.aab
          track: internal
          status: completed

  firebase_app_distribution:
    name: Firebase App Distribution
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.distribute_debug }}

    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: artifacts

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ inputs.tester_groups }}
          file: artifacts/app-debug.apk
