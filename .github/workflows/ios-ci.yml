name: iOS CI

on:
  pull_request:
    branches:
      - master
    paths:
      - 'ios/**'
      - '.maestro/**'
      - '.github/workflows/ios-ci.yml'
      - '.github/scripts/ios-simulator-udid.sh'
      - '.github/scripts/maestro-ios-smoke.sh'
  push:
    branches:
      - master
    paths:
      - 'ios/**'
      - '.maestro/**'
      - '.github/workflows/ios-ci.yml'
      - '.github/scripts/ios-simulator-udid.sh'
      - '.github/scripts/maestro-ios-smoke.sh'
  workflow_dispatch:

# Packages/*/Package.swift 가 swift-tools-version 6.2 와 .defaultIsolation(MainActor.self) 를
# 쓰기 때문에 Xcode 26 이상이 필요하다. macos-15 이미지(Xcode 16.x)에서는 빌드가 깨진다.
# macos-latest 는 이미지 전환기에 조용히 바뀔 수 있어 버전을 고정한다.
env:
  DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=latest
  # 러너 이미지에 SwiftLint 는 없다. 버전을 고정하지 않으면 새 규칙이 추가될 때
  # 코드 변경 없이 CI 가 깨진다.
  SWIFTLINT_VERSION: 0.65.0
  # 러너 이미지에 든 SwiftFormat 은 이미지가 갱신될 때 함께 올라간다. 0.63 에서 수식어 순서
  # 기본값이 바뀌어 코드 변경 없이 CI 가 깨진 적이 있어 버전을 고정한다. 로컬도 이 버전을 쓴다.
  SWIFTFORMAT_VERSION: 0.62.1

jobs:
  lint:
    name: SwiftLint and SwiftFormat
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q -o "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      # 러너 이미지에도 SwiftFormat 이 있지만 버전이 고정되지 않는다. GITHUB_PATH 는 PATH 앞에 붙으므로
      # 내려받은 바이너리가 이미지의 것보다 먼저 잡힌다.
      - name: Install SwiftFormat
        run: |
          curl -sSfL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -q -o "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          chmod +x "$RUNNER_TEMP/swiftformat/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"

      - name: Run SwiftFormat
        run: |
          swiftformat --version
          # 이미지의 SwiftFormat 이 잡히면 고정한 의미가 없으므로 버전부터 확인한다.
          test "$(swiftformat --version)" = "$SWIFTFORMAT_VERSION"
          swiftformat --lint .

      - name: Run SwiftLint
        run: |
          swiftlint version
          swiftlint lint --strict

  test:
    name: Analyze and test
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # 순수 Swift 코드에서 clang 정적 분석기가 잡아내는 건 거의 없다.
      # 실질적인 게이트는 경고를 오류로 승격시키는 쪽인데, 이 설정은 명령줄로 넘기지 않는다.
      # 명령줄 인자는 Firebase·GoogleMobileAds 같은 SPM 의존성 타깃까지 전파되고,
      # 그 패키지들이 쓰는 -suppress-warnings 와 충돌해 컴파일이 실패한다.
      # 대신 CalcMoney.xcodeproj 의 프로젝트 레벨 빌드 설정에 넣어 우리 타깃에만 적용한다.
      - name: Analyze
        run: |
          xcodebuild analyze \
            -workspace CalcMoney.xcworkspace \
            -scheme CalcMoney \
            -destination "$DESTINATION"

      # xcodebuild test가 시뮬레이터를 그 자리에서 켜면 첫 UI 테스트가 부팅과 겹쳐 앱 실행·자동화 준비가 느려지고,
      # 실행 시간 초과나 화면 대기 초과로 실패했다. DESTINATION과 같은 기기(최신 iOS의 iPhone 17 Pro)를
      # 미리 켜고 부팅이 끝날 때까지 기다린다. 기기를 못 찾으면 이 단계만 건너뛰고 xcodebuild에 맡긴다.
      - name: Boot simulator
        run: |
          UDID=$(../.github/scripts/ios-simulator-udid.sh "iPhone 17 Pro")
          if [ -z "$UDID" ]; then
            echo "::warning::iPhone 17 Pro simulator not found; xcodebuild will boot it"
            exit 0
          fi
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      # CalcMoney.xctestplan 하나가 앱 타깃 2개 + 패키지 테스트 3개를 모두 포함한다.
      # 워크스페이스로 실행해야 패키지 테스트 타깃이 플랜에서 해석된다.
      - name: Test
        run: |
          xcodebuild test \
            -workspace CalcMoney.xcworkspace \
            -scheme CalcMoney \
            -testPlan CalcMoney \
            -destination "$DESTINATION" \
            -resultBundlePath "$RUNNER_TEMP/CalcMoney.xcresult"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/CalcMoney.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # Android `e2e_smoke`와 같은 smoke Flow를 iOS 시뮬레이터에서 돌린다. 네트워크가 필요한 release Flow는 돌리지 않는다.
  # 아직 iOS 배포 파이프라인이 없어 막는 job은 없다. ios-v* 배포 job을 만들면 이 job을 needs에 넣어 관문으로 쓴다.
  e2e_smoke:
    name: Maestro smoke test
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Android e2e_smoke와 같은 버전으로 고정한다. 새 릴리스의 동작 변화로 코드 변경 없이 CI가 깨지지 않게 한다.
      MAESTRO_VERSION: 2.1.0
      # 첫 Flow에서 Maestro가 시뮬레이터에 XCTest 드라이버를 설치하고 띄운다. 러너가 느리면 기본 대기 시간을 넘길 수 있다.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
      MAESTRO_CLI_NO_ANALYTICS: 1
      APP_ID: com.ahn.CalcMoney
      MAESTRO_TAGS: smoke
      SIMULATOR_NAME: iPhone 17 Pro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Maestro CLI가 JVM으로 돈다.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # 빌드하는 동안 부팅이 끝나도록 먼저 켠다.
      - name: Boot simulator
        run: |
          UDID=$(.github/scripts/ios-simulator-udid.sh "$SIMULATOR_NAME")
          if [ -z "$UDID" ]; then
            echo "::error::$SIMULATOR_NAME simulator not found"
            exit 1
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true

      - name: Build app
        working-directory: ios
        run: |
          xcodebuild build \
            -workspace CalcMoney.xcworkspace \
            -scheme CalcMoney \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"
          echo "APP_PATH=$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/CalcMoney.app" >> "$GITHUB_ENV"

      - name: Run Maestro smoke flows
        run: |
          xcrun simctl bootstatus "$UDID" -b
          .github/scripts/maestro-ios-smoke.sh

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-maestro-smoke-results
          path: build/maestro/
          if-no-files-found: ignore
          retention-days: 7
