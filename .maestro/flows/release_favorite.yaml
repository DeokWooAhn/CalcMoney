# 통화 선택 창에서 즐겨찾기를 추가하면 즐겨찾기 탭에 카드가 생긴다. Firestore가 필요하다.
# launch_clean이 앱 데이터를 지우므로 매번 즐겨찾기가 빈 상태에서 시작한다.
appId: ${APP_ID}
name: 통화 선택 창에서 추가한 즐겨찾기가 즐겨찾기 탭에 보인다
tags:
  - release
---
- runFlow: ../subflows/launch_clean.yaml
- tapOn:
    id: "tab.exchange"
# 통화 목록이 비어 있으면 선택 버튼이 비활성이라, 환율이 뜬 뒤에 연다.
- extendedWaitUntil:
    visible: "1 [A-Z]{3} = [0-9]+\\.[0-9]{4} [A-Z]{3}"
    timeout: 20000
- tapOn:
    id: "currency.selector"
    childOf:
      id: "exchange.from"
# 검색창에 통화 코드를 쳐서 찾는다. 화면 문구는 언어마다 달라서 코드로 찾는다.
- tapOn:
    id: "currency.search"
- inputText: "aud"
- tapOn:
    id: "favorite.toggle.AUD"
# 행을 눌러 AUD를 기준 통화로 고르면 안 된다. 즐겨찾기 화면은 기준 통화와 같은 통화를 카드로 만들지 않는다.
# 통화는 그대로 두고 창만 닫는다. Android 바텀시트는 뒤로가기, iOS 시트는 닫기 버튼으로 닫는다.
# Android는 키보드가 떠 있으면 첫 뒤로가기가 키보드만 내리므로 먼저 키보드를 내린다.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "currency.picker.close"
- tapOn:
    id: "tab.favorite"
- extendedWaitUntil:
    visible:
      id: "favorite.card.AUD"
    timeout: 15000
