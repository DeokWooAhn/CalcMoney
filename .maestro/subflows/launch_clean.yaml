# 앱 데이터를 지우고 UI 테스트 모드로 실행한 뒤 계산기 화면이 뜰 때까지 기다린다.
# UI_TESTING은 광고 동의(UMP) 흐름과 광고 로드를 끈다 (Android MainActivity, iOS AdConsentManager).
appId: ${APP_ID}
---
# Android는 앱이 살아 있을 때 강제 종료하면(데이터 지우기 포함) 옛 태스크를 정리하면서 1초 뒤에 그 태스크의
# 프로세스를 한 번 더 죽인다. 그 1초 안에 앱을 다시 띄우면 새 프로세스가 옛 태스크에 붙었다가 같이 죽어
# 빈 화면으로 남는다. 느린 CI 에뮬레이터에서 앞 Flow가 띄워 둔 앱을 clearState로 지울 때 이렇게 됐다.
# 먼저 앱을 끄고 그 정리가 끝날 때까지 기다린 뒤 데이터를 지우고 띄운다.
- runFlow:
    when:
      platform: Android
    commands:
      - stopApp
      # Maestro에는 sleep이 없어서, 나타나지 않는 id를 optional로 기다리는 것으로 2초를 번다.
      - extendedWaitUntil:
          visible:
            id: "wait.never"
          timeout: 2000
          optional: true
- launchApp:
    clearState: true
    # 비워 두지 않으면 기본값이 `all: allow`다. Android에서는 권한 목록을 읽으려고 APK 전체(debug 약 89MB)를
    # 매번 adb로 받는데, CI 에뮬레이터에서 이 전송이 가끔 수 분씩 멈췄다. 이 앱은 런타임 권한을 쓰지 않아
    # 받을 필요가 없다. 권한이 필요한 화면이 생기면 `all` 대신 그 권한만 적는다(예: `notifications: allow`).
    permissions: {}
    arguments:
      UI_TESTING: true
# 보이는 순간 넘어가므로 실기기·시뮬레이터에서는 오래 걸리지 않는다. CI 에뮬레이터는 콜드 스타트가
# 느리므로 넉넉히 둔다.
- extendedWaitUntil:
    visible:
      id: "screen.calculator"
    timeout: 30000
