# 앱 데이터를 지우고 UI 테스트 모드로 실행한 뒤 계산기 화면이 뜰 때까지 기다린다.
# UI_TESTING은 광고 동의(UMP) 흐름과 광고 로드를 끈다 (Android MainActivity, iOS AdConsentManager).
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    arguments:
      UI_TESTING: true
# 보이는 순간 넘어가므로 실기기·시뮬레이터에서는 오래 걸리지 않는다. CI 에뮬레이터(소프트웨어 렌더링)는
# clearState 뒤 콜드 스타트가 15초를 넘길 때가 있어 넉넉히 둔다.
- extendedWaitUntil:
    visible:
      id: "screen.calculator"
    timeout: 30000
