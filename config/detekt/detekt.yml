config:
  validation: true
  warningsAsErrors: false

ktlint:
  active: true
  code_style: intellij_idea
  autoCorrect: true
  MaximumLineLength:
    active: true
    maxLineLength: 120
  FunctionSignature:
    active: false
  FunctionExpressionBody:
    active: false
  ChainMethodContinuation:
    active: false
  ClassSignature:
    active: false
  ImportOrdering:
    active: false
  Indentation:
    active: false
  MultilineExpressionWrapping:
    active: false
  TrailingCommaOnCallSite:
    active: true
  # detekt 2.0.0-alpha.0 → alpha.6에서 ktlint 규칙의 기본 활성 상태가 바뀌었다.
  # 업그레이드만으로 검사 기준이 달라지지 않게 alpha.0 때 상태로 고정한다. 바꿀 때는 별도 PR에서 코드와 함께 고친다.
  BlankLineBetweenWhenConditions:
    active: false
  Kdoc:
    active: false
  MixedConditionOperators:
    active: false
  SpacingAroundSquareBrackets:
    active: false
  ThenSpacing:
    active: false
  BlankLineBeforeDeclaration:
    active: true
  IfElseBracing:
    active: true
  IfElseWrapping:
    active: true
  NoBlankLineInList:
    active: true
  NoConsecutiveComments:
    active: true
  NoEmptyFirstLineInClassBody:
    active: true
  NoSingleLineBlockComment:
    active: true
  StringTemplateIndent:
    active: true
  TryCatchFinallySpacing:
    active: true

style:
  ReturnCount:
    active: true
    max: 4
  MagicNumber:
    active: false
  LoopWithTooManyJumpStatements:
    active: false

empty-blocks:
  EmptyClassBlock:
    active: false
  EmptyFunctionBlock:
    active: false

complexity:
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 15
  LongMethod:
    active: true
    allowedLines: 100
  LongParameterList:
    active: false
  LargeClass:
    active: true
    allowedLines: 800
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 30
    allowedFunctionsPerClass: 20
    allowedFunctionsPerInterface: 15
    allowedFunctionsPerObject: 20
    allowedFunctionsPerEnum: 15

exceptions:
  TooGenericExceptionCaught:
    active: false

naming:
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
  MatchingDeclarationName:
    active: true
